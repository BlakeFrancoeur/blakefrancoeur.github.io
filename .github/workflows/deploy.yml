name: Deploy Axis Fluent Components

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site repository
        uses: actions/checkout@v4

      - name: Checkout Axis Fluent Components
        uses: actions/checkout@v4
        with:
          repository: AxisCommunications/fluent-components
          path: axis-fluent-components

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.5.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: axis-fluent-components/pnpm-lock.yaml

      - name: Install Axis Fluent Components dependencies
        working-directory: axis-fluent-components
        run: pnpm install --frozen-lockfile

      - name: Build the exact Axis examples application
        working-directory: axis-fluent-components/examples
        run: pnpm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Axis examples
        uses: actions/upload-pages-artifact@v3
        with:
          path: axis-fluent-components/examples/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
