name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Checkout Axis Fluent Components
        uses: actions/checkout@v4
        with:
          repository: AxisCommunications/fluent-components
          path: fluent-components

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.5.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: fluent-components/pnpm-lock.yaml
          registry-url: https://npm.pkg.github.com

      - name: Install Axis dependencies
        working-directory: fluent-components
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.AXIS_FLUENT }}

      - name: Build Axis Fluent Components examples
        working-directory: fluent-components
        run: pnpm --filter examples build --base=/

      - name: Verify built asset paths
        run: |
          grep -o 'src="[^"]*"' fluent-components/examples/dist/index.html
          test -f fluent-components/examples/dist/assets/index-*.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Axis examples
        uses: actions/upload-pages-artifact@v3
        with:
          path: fluent-components/examples/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
